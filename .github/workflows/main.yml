name: Deploy Accretion

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENV_TAG=latest" >> $GITHUB_ENV
          else
            echo "ENV_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          no-cache: true
          tags: |
            skyrack2026/accretion-backend:${{ env.ENV_TAG }}
            skyrack2026/accretion-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          no-cache: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          tags: |
            skyrack2026/accretion-frontend:${{ env.ENV_TAG }}
            skyrack2026/accretion-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Set Environment
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "ENV_TAG=latest"                  >> $GITHUB_ENV
            echo "DEPLOY_DIR=/root/Accretion"      >> $GITHUB_ENV
            echo "BACKEND_SVC=accretion-backend"   >> $GITHUB_ENV
            echo "FRONTEND_SVC=accretion-frontend" >> $GITHUB_ENV
          else
            echo "ENV_TAG=dev"                         >> $GITHUB_ENV
            echo "DEPLOY_DIR=/root/Accretion-dev"      >> $GITHUB_ENV
            echo "BACKEND_SVC=accretion-backend-dev"   >> $GITHUB_ENV
            echo "FRONTEND_SVC=accretion-frontend-dev" >> $GITHUB_ENV
          fi

      - name: Deploy Application
        run: |
          sudo bash -c '
          set -e

          DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
          ENV_TAG="${{ env.ENV_TAG }}"
          BACKEND_SVC="${{ env.BACKEND_SVC }}"
          FRONTEND_SVC="${{ env.FRONTEND_SVC }}"

          echo "=============================="
          echo "Branch  : ${{ github.ref_name }}"
          echo "Tag     : $ENV_TAG"
          echo "Dir     : $DEPLOY_DIR"
          echo "=============================="

          cd $DEPLOY_DIR

          sed -i "s|skyrack2026/accretion-backend:.*|skyrack2026/accretion-backend:$ENV_TAG|" docker-compose.yml
          sed -i "s|skyrack2026/accretion-frontend:.*|skyrack2026/accretion-frontend:$ENV_TAG|" docker-compose.yml

          docker compose pull $BACKEND_SVC $FRONTEND_SVC
          docker compose up -d --no-deps --force-recreate $BACKEND_SVC $FRONTEND_SVC
          docker image prune -af

          echo "✅ Accretion [$ENV_TAG] deployed successfully"
          '
